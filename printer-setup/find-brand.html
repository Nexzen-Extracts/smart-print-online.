<!DOCTYPE html>

<body style="margin:0; padding:0; overflow:hidden; font-family:Montserrat, sans-serif;">

<div style="

  width:100%;
  height:100vh;
  overflow:hidden;
">

  <!-- Background (FIXED BETTER) -->
  <div style="
    position:absolute;
    width:100%;
